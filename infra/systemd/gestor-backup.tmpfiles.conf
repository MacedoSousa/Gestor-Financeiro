# Pastas do ReadWritePaths do gestor-backup.service que precisam existir antes dele (com pasta
# inexistente, a unidade falha antes de rodar): a pasta local do backup (GF_BACKUP_DIR padrão)
# e a da config do rclone (sem rclone configurado, fica vazia).
#   sudo cp infra/systemd/gestor-backup.tmpfiles.conf /etc/tmpfiles.d/gestor-backup.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/gestor-backup.conf
d /var/backups/gestor 0700 root root -
d /root/.config/rclone 0700 root root -
