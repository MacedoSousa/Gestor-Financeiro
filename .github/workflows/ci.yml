name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes das guardas
        run: scripts/guardas/testes.sh
      - name: Guardas no repositório inteiro
        run: scripts/guardas/verificar-repositorio.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gestor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Build (gera contracts/openapi.json)
        run: dotnet build backend/GestorFinanceiro.slnx -c Release

      - name: Testes unitários e de arquitetura
        run: dotnet test backend/GestorFinanceiro.slnx -c Release --no-build

      - name: Migrações aplicam do zero e bloqueiam DELETE
        env:
          PGPASSWORD: ci
          ConnectionStrings__Migrador: Host=localhost;Database=gestor;Username=gf_migrator;Password=ci
        run: |
          psql -h localhost -U postgres -d gestor -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE gf_migrator LOGIN PASSWORD 'ci'; CREATE ROLE gf_app LOGIN PASSWORD 'ci';" \
            -c "ALTER DATABASE gestor OWNER TO gf_migrator;"
          dotnet run --project backend/src/Host/GestorFinanceiro.Api -c Release --no-build -- --migrar
          ./db/testes/verificar-protecoes.sh "host=localhost dbname=gestor"

      - name: Contrato OpenAPI em dia
        run: |
          if git ls-files --error-unmatch contracts/openapi.json >/dev/null 2>&1; then
            git diff --exit-code contracts/openapi.json || {
              echo "contracts/openapi.json mudou: commite o arquivo gerado e rode npm run gen:api."; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: contracts

      - name: Cliente da API em dia
        run: |
          if git ls-files --error-unmatch ../contracts/openapi.json >/dev/null 2>&1; then
            npm run gen:api
            git diff --exit-code src/api/schema.d.ts || {
              echo "src/api/schema.d.ts desatualizado: rode npm run gen:api e commite."; exit 1; }
          fi

      - run: npm run check

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: sudo apt-get update && sudo apt-get install -y age shellcheck rclone

      # find em vez de infra/backup/**/*.sh: sem globstar, ** não pega infra/backup/*.sh.
      - name: shellcheck
        run: find infra/backup -name '*.sh' -print0 | xargs -0 shellcheck -x

      - name: Testes do backup (Postgres descartável em docker)
        run: infra/backup/testes/rodar-todos.sh

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
